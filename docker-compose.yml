name: redgreen-front

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: redgreen-front:${FRONT_TAG:-latest}
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:${BACKEND_PORT:-3000}}
    ports:
      - '${FRONT_PORT:-8090}:8080'
    networks:
      - app

  jenkins:
    image: ${JENKINS_IMAGE:-phandradd/redgreen-front-jenkins:latest}
    pull_policy: always
    restart: unless-stopped
    group_add:
      - '${DOCKER_SOCKET_GID:-0}'
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:?defina JENKINS_ADMIN_USER no .env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?defina JENKINS_ADMIN_PASSWORD no .env}
      JENKINS_PUBLIC_URL: ${JENKINS_PUBLIC_URL:-http://localhost:8081/}
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:${BACKEND_PORT:-3000}}
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:?defina E2E_ADMIN_EMAIL no .env}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:?defina E2E_ADMIN_PASSWORD no .env}
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME:-}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN:-}
      JENKINS_IMAGE_REPO: ${JENKINS_IMAGE_REPO:-phandradd/redgreen-front-jenkins}
      EMAIL_TO: ${EMAIL_TO:?defina EMAIL_TO no .env}
      EMAIL_FROM: ${EMAIL_FROM:-jenkins@redgreen.local}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '127.0.0.1:${JENKINS_PORT:-8081}:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/login']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mailpit:
        condition: service_started
      unit-tests:
        condition: service_started
      e2e-tests:
        condition: service_started
    networks:
      - ci

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025'
    networks:
      - ci

  unit-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.unit-tests
    image: redgreen-front-unit-tests:local
    container_name: redgreen-front-unit-tests
    restart: unless-stopped
    volumes:
      - jenkins_home:/var/jenkins_home

  e2e-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e-tests
    image: redgreen-front-e2e-tests:local
    container_name: redgreen-front-e2e-tests
    restart: unless-stopped
    volumes:
      - jenkins_home:/var/jenkins_home

  perf-tests:
    build:
      context: .
      dockerfile: Dockerfile.performance
    image: redgreen-perf-tests:local
    profiles:
      - perf
    init: true
    shm_size: 1g
    environment:
      PERF_BASE_URL: http://frontend:8080
      PERF_OUTPUT_DIR: /reports/performance
    volumes:
      - reports:/reports
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - app

networks:
  app:
  ci:

volumes:
  jenkins_home:
  mailpit_data:
  reports:

name: redgreen

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_REPO:-redgreen-front}:${FRONT_TAG:-latest}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:3000
    ports:
      - '${FRONT_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

  backend:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "tar -C /src --exclude=./node_modules --exclude=./dist -cf - . | tar -C /app -xf - && npm ci && npm run build && npm run start:prod"
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-redgreen}
      POSTGRES_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    volumes:
      # Somente leitura: o codigo e copiado para /app e compilado dentro do container, sem alterar o RedGreen-Back.
      - ${BACKEND_PATH:-../RedGreen-Back}:/src:ro
      - backend_node_modules:/app/node_modules
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - app

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-redgreen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-redgreen}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins
    image: redgreen-front-jenkins:local
    restart: unless-stopped
    # GID do dono do /var/run/docker.sock no host (0 no Docker Desktop); sem ele o pipeline nao acessa o Docker.
    group_add:
      - '${DOCKER_SOCKET_GID:-0}'
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:?defina JENKINS_ADMIN_USER no .env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?defina JENKINS_ADMIN_PASSWORD no .env}
      JENKINS_PUBLIC_URL: ${JENKINS_PUBLIC_URL:-http://localhost:8081/}
      # Segue BACKEND_PORT: o app do estagio E2E chega na API pela porta publicada no host.
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:${BACKEND_PORT:-3000}}
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-}
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME:-}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN:-}
      DOCKERHUB_REPO: ${DOCKERHUB_REPO:-}
      EMAIL_TO: ${EMAIL_TO:?defina EMAIL_TO no .env}
      EMAIL_FROM: ${EMAIL_FROM:-jenkins@redgreen.local}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '127.0.0.1:${JENKINS_PORT:-8081}:8080'
    depends_on:
      - mailpit
    networks:
      - ci

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025'
    networks:
      - ci

  # container_name fixo: o Jenkinsfile faz docker exec por esse nome, no workspace do jenkins_home.
  unit-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.unit-tests
    image: redgreen-front-unit-tests:local
    container_name: redgreen-front-unit-tests
    restart: unless-stopped
    volumes:
      - jenkins_home:/var/jenkins_home

  e2e-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e-tests
    image: redgreen-front-e2e-tests:local
    container_name: redgreen-front-e2e-tests
    restart: unless-stopped
    volumes:
      - jenkins_home:/var/jenkins_home

  perf-tests:
    build:
      context: .
      dockerfile: Dockerfile.performance
    image: redgreen-perf-tests:local
    profiles:
      - perf
    init: true
    # Chromium headless trava com o /dev/shm padrao de 64 MB.
    shm_size: 1g
    environment:
      PERF_BASE_URL: http://frontend:8080
      PERF_OUTPUT_DIR: /reports/performance
    volumes:
      - reports:/reports
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - app

networks:
  app:
  ci:

volumes:
  postgres_data:
  jenkins_home:
  mailpit_data:
  reports:
  backend_node_modules:
